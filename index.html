<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Task Portal - Daily Task Dispatch & Digital Evaluation</title>

    <!-- Open Graph / Social Media Preview Tags -->
    <meta property="og:title" content="Remote Task Portal - Daily Task Dispatch">
    <meta property="og:description" content="Join our global remote task pool to evaluate mobile applications, validate digital data, and earn daily rewards.">
    <meta property="og:image" content="https://i.postimg.cc/C51yqCr7/IMG-20260916-090904.png">
    <meta property="og:url" content="https://remotetaskportal.site">
    <meta property="og:type" content="website">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Remote Task Portal - Daily Task Dispatch">
    <meta name="twitter:description" content="Join our global remote task pool to evaluate mobile applications, validate digital data, and earn daily rewards.">
    <meta name="twitter:image" content="https://i.postimg.cc/C51yqCr7/IMG-20260916-090904.png">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b091a] text-slate-100 flex items-center justify-center min-h-screen m-0">
    <div class="bg-[#121829] p-8 rounded-xl shadow-2xl w-full max-w-md text-center border border-slate-800">
        <div class="mb-4 text-cyan-400 text-3xl">
            <i class="fa-solid fa-globe"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2 text-slate-100">Remote Task Portal</h1>
        <p class="text-slate-400 text-sm mb-6">Masukkan email aktif Anda untuk mulai mengakses sesi tugas harian.</p>
        
        <form action="dashboard.html" method="GET" class="space-y-4">
            <input type="email" name="user_email" placeholder="nama@email.com" required 
                class="w-full px-4 py-3 bg-[#0f172a] border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            <button type="submit" 
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold rounded-lg hover:from-cyan-400 hover:to-blue-500 transition shadow-lg shadow-cyan-500/20">
                Masuk ke Dasbor
            </button>
        </form>
    </div>
</body>
</html>
